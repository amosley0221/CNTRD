# Render Blueprint for CNTRD.
# Use the "Deploy to Render" button in the GitHub repo, or in the Render
# dashboard: New + → Blueprint → connect this repo.
#
# Persistent setup: SQLite + uploaded avatars live on a 1GB disk mounted
# at /var/data, so accounts and posts survive every redeploy.
#
# JWT_SECRET is auto-generated on first deploy and reused on subsequent
# deploys; rotating it logs everyone out.

services:
  - type: web
    name: cntrd
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # ADMIN_EMAILS — comma-separated list of emails that are auto-promoted
      # to admin on login/register. Set this *only* to your own email.
      # Anyone whose email is in this list gets admin privileges (see all
      # users, ban accounts, delete posts) the next time they sign in.
      - key: ADMIN_EMAILS
        sync: false              # don't commit your email to git; set in dashboard
      # SQLite + uploads live on the persistent disk mounted below.
      - key: DATABASE_PATH
        value: /var/data/cntrd.db
      - key: UPLOADS_PATH
        value: /var/data/uploads

    disk:
      name: cntrd-data
      mountPath: /var/data
      sizeGB: 1
