<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNTRD – Post</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="app-page">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a href="/feed.html" class="sidebar-logo">
        <div class="brand-logo-sm">C</div>
        <span class="sidebar-brand-text">CNTRD</span>
      </a>
      <nav class="sidebar-nav">
        <a href="/feed.html" class="nav-item" id="nav-home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="/feed.html?tab=explore" class="nav-item" id="nav-explore">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>Explore</span>
        </a>
        <a href="#" class="nav-item" id="nav-profile-link">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Profile</span>
        </a>
      </nav>
      <button class="btn btn-primary compose-btn" id="compose-btn">Post</button>
      <div class="sidebar-user" id="sidebar-user">
        <div class="sidebar-avatar-wrap">
          <img class="sidebar-avatar" id="sidebar-avatar" src="/css/default-avatar.svg" alt="avatar" />
        </div>
        <div class="sidebar-user-info">
          <span class="sidebar-display-name" id="sidebar-display-name">Loading…</span>
          <span class="sidebar-username" id="sidebar-username">@…</span>
        </div>
        <button class="sidebar-logout" id="logout-btn" title="Log out">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="feed-header sticky-top" style="padding: 14px 16px; display:flex; align-items:center; gap:16px;">
      <a href="javascript:history.back()" style="color:var(--text-muted); display:flex; align-items:center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </a>
      <h2 style="font-size:18px; font-weight:800;">Post</h2>
    </div>

    <div id="post-area">
      <div class="feed-loading"><div class="spinner"></div></div>
    </div>

    <!-- Reply compose -->
    <div class="compose-box" id="reply-compose" style="display:none;">
      <div class="compose-avatar-wrap">
        <img class="compose-avatar" id="reply-avatar" src="/css/default-avatar.svg" alt="avatar" />
      </div>
      <div class="compose-right">
        <textarea class="compose-textarea" id="reply-text" placeholder="Post your reply…" maxlength="280"></textarea>
        <div class="compose-footer">
          <span class="compose-count" id="reply-count">280</span>
          <button class="btn btn-primary btn-sm" id="reply-btn">Reply</button>
        </div>
      </div>
    </div>

    <div id="replies-area"></div>
  </main>

  <!-- Right Sidebar (empty) -->
  <aside class="right-sidebar"></aside>

  <!-- Compose Modal -->
  <div class="modal-overlay" id="compose-modal" style="display:none">
    <div class="modal">
      <button class="modal-close" id="close-compose-modal">&times;</button>
      <div class="compose-box modal-compose">
        <div class="compose-avatar-wrap">
          <img class="compose-avatar" id="modal-compose-avatar" src="/css/default-avatar.svg" alt="avatar" />
        </div>
        <div class="compose-right">
          <textarea class="compose-textarea" id="modal-compose-text" placeholder="What's happening?" maxlength="280"></textarea>
          <div class="compose-footer">
            <span class="compose-count" id="modal-compose-count">280</span>
            <button class="btn btn-primary btn-sm" id="modal-post-btn">Post</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
