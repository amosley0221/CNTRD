<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CNTRD — Where the game gets loud.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="CNTRD — a sports-only social network. Hot takes, live scores, and Plays from the people who care most." />
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, html, body { margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0A0A0B;
      color: #F4F1EA;
      overflow: hidden;
    }
    @keyframes cn-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.4); }
    }
    *::-webkit-scrollbar { display: none; }
    *                   { scrollbar-width: none; }
    .cn-themed {
      background: var(--cn-bg);
      color: var(--cn-text);
      font-family: var(--cn-font-body);
    }
    #root { width: 100vw; height: 100vh; overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="/js/cntrd/data.jsx"></script>
  <script type="text/babel" src="/js/cntrd/theme.jsx"></script>
  <script type="text/babel" src="/js/cntrd/posts.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-feed.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-screens.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-auth.jsx"></script>
  <script type="text/babel" src="/js/cntrd/desktop.jsx"></script>
  <script type="text/babel" src="/js/cntrd/app.jsx"></script>
</body>
</html>
