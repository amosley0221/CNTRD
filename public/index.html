<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNTRD</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <!-- Auth Modal -->
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">C</div>
      <h1 class="brand-name">CNTRD</h1>
      <p class="brand-tagline">The center of every conversation.</p>
    </div>

    <div class="auth-card" id="auth-card">

      <!-- Login Form -->
      <div id="login-form" class="auth-form active">
        <h2>Sign in</h2>
        <div class="form-group">
          <input type="text" id="login-field" placeholder="Username or email" autocomplete="username" />
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
        </div>
        <div class="form-error" id="login-error"></div>
        <button class="btn btn-primary btn-full" id="login-btn">Sign in</button>
        <p class="auth-switch">Don't have an account? <a href="#" id="show-register">Sign up</a></p>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="auth-form">
        <h2>Create account</h2>
        <div class="form-group">
          <input type="text" id="reg-display-name" placeholder="Display name" autocomplete="name" />
        </div>
        <div class="form-group">
          <input type="text" id="reg-username" placeholder="Username (letters, numbers, _)" autocomplete="username" />
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" placeholder="Email address" autocomplete="email" />
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" placeholder="Password (min 6 characters)" autocomplete="new-password" />
        </div>
        <div class="form-error" id="register-error"></div>
        <button class="btn btn-primary btn-full" id="register-btn">Create account</button>
        <p class="auth-switch">Already have an account? <a href="#" id="show-login">Sign in</a></p>
      </div>

    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
