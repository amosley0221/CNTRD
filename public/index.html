<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CNTRD — Where the game gets loud.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="CNTRD — a sports-only social network. Hot takes, live scores, and Plays from the people who care most." />
  <meta name="theme-color" content="#0A0A0B" />
  <!-- Favicon + Home Screen icon. The same SVG is used everywhere; modern
       Safari (iOS 16+), Chrome, Edge, and Firefox all render SVG favicons
       and apple-touch-icons natively. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="mask-icon" href="/icon.svg" color="#D4FF3A" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CNTRD" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, html, body { margin: 0; padding: 0; }
    /* Lock the layout to the *dynamic* viewport so iOS Safari's URL-bar
       reveal/hide doesn't push the absolute-positioned bottom nav off-screen.
       100vh fallback for older browsers. */
    html, body { height: 100vh; height: 100dvh; }
    body {
      font-family: "Inter Tight", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0A0A0B;
      color: #F4F1EA;
      overflow: hidden;
    }
    @keyframes cn-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.4); }
    }
    @keyframes cn-spin {
      to { transform: rotate(360deg); }
    }
    *::-webkit-scrollbar { display: none; }
    *                   { scrollbar-width: none; }
    .cn-themed {
      background: var(--cn-bg);
      color: var(--cn-text);
      font-family: var(--cn-font-body);
    }
    #root {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      /* In iOS standalone mode (Add to Home Screen → "open as app"), the
         status bar / Dynamic Island overlays the page. Pad the root by
         the system safe-area inset so the header buttons clear the
         clock and signal icons. In normal browser tabs these env values
         are 0, so this is a no-op outside of installed mode. */
      padding-top: env(safe-area-inset-top);
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="/js/cntrd/data.jsx"></script>
  <script type="text/babel" src="/js/cntrd/theme.jsx"></script>
  <script type="text/babel" src="/js/cntrd/api.jsx"></script>
  <script type="text/babel" src="/js/cntrd/posts.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-feed.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-screens.jsx"></script>
  <script type="text/babel" src="/js/cntrd/mobile-auth.jsx"></script>
  <script type="text/babel" src="/js/cntrd/desktop.jsx"></script>
  <script type="text/babel" src="/js/cntrd/teams-picker.jsx"></script>
  <script type="text/babel" src="/js/cntrd/leagues-picker.jsx"></script>
  <script type="text/babel" src="/js/cntrd/pages.jsx"></script>
  <script type="text/babel" src="/js/cntrd/game-detail.jsx"></script>
  <script type="text/babel" src="/js/cntrd/tag-feed.jsx"></script>
  <script type="text/babel" src="/js/cntrd/messages.jsx"></script>
  <script type="text/babel" src="/js/cntrd/notifications.jsx"></script>
  <script type="text/babel" src="/js/cntrd/notification-prefs.jsx"></script>
  <script type="text/babel" src="/js/cntrd/blocks.jsx"></script>
  <script type="text/babel" src="/js/cntrd/account.jsx"></script>
  <script type="text/babel" src="/js/cntrd/admin.jsx"></script>
  <script type="text/babel" src="/js/cntrd/app.jsx"></script>
</body>
</html>
