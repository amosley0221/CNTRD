<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CNTRD">
  <!-- Brand: dark stadium background with the accent-yellow "C" cut from
       a heavy condensed sans-serif (mirrors the Anton-driven CNTRD
       wordmark used across the app). Encoded as a path so the icon
       renders identically without depending on a webfont. -->
  <rect width="256" height="256" rx="48" ry="48" fill="#0A0A0B"/>
  <!--
       Outer arc: radius 92, swept counterclockwise around the left side
       from top-right opening (216,102) to bottom-right opening (216,154).
       Inner arc: radius 52, swept clockwise back from (173,154) to
       (173,102). The two horizontal terminals (closing Z + the L) make
       the flat openings characteristic of Anton's "C".
  -->
  <path fill="#D4FF3A"
        d="M 216 102
           A 92 92 0 1 0 216 154
           L 173 154
           A 52 52 0 1 1 173 102
           Z"/>
</svg>
