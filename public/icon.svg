<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CNTRD">
  <!-- Brand mark: dark stadium background with a heavy condensed-sans
       "C" cut in the same off-white the CNTRD wordmark uses on screen.
       Path-based so the icon renders identically across browsers and
       in iOS standalone mode (Add to Home Screen) without depending on
       a webfont being available in the favicon context. -->
  <rect width="256" height="256" rx="48" ry="48" fill="#0A0A0B"/>
  <!--
       Outer arc: radius 96, swept around the left side from a top-right
       opening that sits ~12° above horizontal to a bottom-right opening
       ~12° below. Inner arc: radius 50, swept back through the counter
       at ±25°. The result has Anton's heavy stem (≈46px wall) and the
       slightly slanted terminals that give the wordmark its character —
       not a perfectly geometric horizontal-cut C.
  -->
  <path fill="#F4F1EA"
        d="M 222 108
           A 96 96 0 1 0 222 148
           L 173 149
           A 50 50 0 1 1 173 107
           Z"/>
</svg>
