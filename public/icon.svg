<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CNTRD">
  <!--
    Brand mark: dark stadium background with the letter "C" set in
    the same Anton typeface used for the CNTRD wordmark on the site.
    Browser tab / desktop favicon contexts that fetch the SVG and
    honor @import will render true Anton; iOS apple-touch-icon
    rasterization may fall back to Impact (visually similar). Either
    way the C reads as the wordmark's "C" rather than a hand-drawn
    geometric shape.
  -->
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
      .cntrd-c {
        font-family: 'Anton', 'Impact', 'Oswald', system-ui, sans-serif;
        font-weight: 400;       /* Anton ships at 400 only */
        fill: #F4F1EA;          /* matches --cn-text in dark mode */
        letter-spacing: -0.01em;
      }
    </style>
  </defs>
  <rect width="256" height="256" rx="48" ry="48" fill="#0A0A0B"/>
  <text class="cntrd-c"
        x="128" y="216"
        font-size="280"
        text-anchor="middle"
        textLength="160" lengthAdjust="spacingAndGlyphs">C</text>
</svg>
