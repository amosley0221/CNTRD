<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNTRD – Profile</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="app-page">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a href="/feed.html" class="sidebar-logo">
        <div class="brand-logo-sm">C</div>
        <span class="sidebar-brand-text">CNTRD</span>
      </a>

      <nav class="sidebar-nav">
        <a href="/feed.html" class="nav-item" id="nav-home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="/feed.html?tab=explore" class="nav-item" id="nav-explore">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>Explore</span>
        </a>
        <a href="#" class="nav-item active" id="nav-profile-link">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Profile</span>
        </a>
      </nav>

      <button class="btn btn-primary compose-btn" id="compose-btn">Post</button>

      <div class="sidebar-user" id="sidebar-user">
        <div class="sidebar-avatar-wrap">
          <img class="sidebar-avatar" id="sidebar-avatar" src="/css/default-avatar.svg" alt="avatar" />
        </div>
        <div class="sidebar-user-info">
          <span class="sidebar-display-name" id="sidebar-display-name">Loading…</span>
          <span class="sidebar-username" id="sidebar-username">@…</span>
        </div>
        <button class="sidebar-logout" id="logout-btn" title="Log out">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Profile Header -->
    <div class="profile-header-area">
      <!-- Banner -->
      <div class="profile-banner" id="profile-banner">
        <div class="banner-placeholder"></div>
        <label class="banner-upload-btn" id="banner-upload-label" style="display:none" title="Change banner">
          <svg viewBox="0 0 24 24"><path d="M12 15.2l-4.24-4.24 1.41-1.41L11 11.38V4h2v7.38l1.83-1.83 1.41 1.41L12 15.2zM20 18H4v-3H2v3c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-3h-2v3z"/></svg>
          <input type="file" id="banner-upload" accept="image/*" style="display:none" />
        </label>
      </div>

      <!-- Profile info row -->
      <div class="profile-info-row">
        <div class="profile-avatar-container">
          <img class="profile-avatar" id="profile-avatar" src="/css/default-avatar.svg" alt="avatar" />
          <label class="avatar-upload-btn" id="avatar-upload-label" style="display:none" title="Change photo">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="file" id="avatar-upload" accept="image/*" style="display:none" />
          </label>
        </div>
        <div class="profile-actions">
          <button class="btn btn-outline" id="edit-profile-btn" style="display:none">Edit profile</button>
          <button class="btn btn-primary" id="follow-btn" style="display:none">Follow</button>
        </div>
      </div>

      <!-- Profile details -->
      <div class="profile-details">
        <h2 class="profile-display-name" id="profile-display-name">Loading…</h2>
        <span class="profile-username" id="profile-username">@…</span>

        <!-- Team Tags -->
        <div class="profile-tags" id="profile-tags"></div>

        <p class="profile-bio" id="profile-bio"></p>

        <div class="profile-meta">
          <span class="profile-joined" id="profile-joined"></span>
        </div>

        <div class="profile-stats">
          <a href="#" class="stat-link" id="following-link">
            <strong id="following-count">0</strong> Following
          </a>
          <a href="#" class="stat-link" id="followers-link">
            <strong id="followers-count">0</strong> Followers
          </a>
        </div>
      </div>
    </div>

    <!-- Profile Posts Feed -->
    <div class="feed-header">
      <div class="feed-tabs">
        <button class="feed-tab active">Posts</button>
      </div>
    </div>

    <div class="feed" id="profile-feed">
      <div class="feed-loading" id="profile-feed-loading">
        <div class="spinner"></div>
      </div>
    </div>

    <button class="load-more-btn" id="profile-load-more" style="display:none">Load more</button>
  </main>

  <!-- Right Sidebar -->
  <aside class="right-sidebar">
    <div class="widget" id="edit-profile-widget" style="display:none">
      <h3 class="widget-title">Edit Profile</h3>
      <div class="edit-profile-form">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="edit-display-name" maxlength="50" />
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea id="edit-bio" maxlength="160" rows="3" placeholder="Tell the world about yourself…"></textarea>
          <span class="char-count" id="bio-count">160</span>
        </div>
        <div class="form-group">
          <label>Favorite Teams <small>(up to 5, press Enter or comma)</small></label>
          <div class="tag-input-wrap" id="tag-input-wrap">
            <input type="text" id="tag-input" placeholder="e.g. Lakers, Cowboys…" maxlength="30" />
          </div>
          <div class="tags-preview" id="tags-preview"></div>
        </div>
        <div class="form-error" id="edit-error"></div>
        <button class="btn btn-primary btn-full" id="save-profile-btn">Save changes</button>
      </div>
    </div>
  </aside>

  <!-- Compose Modal (reused) -->
  <div class="modal-overlay" id="compose-modal" style="display:none">
    <div class="modal">
      <button class="modal-close" id="close-compose-modal">&times;</button>
      <div class="compose-box modal-compose">
        <div class="compose-avatar-wrap">
          <img class="compose-avatar" id="modal-compose-avatar" src="/css/default-avatar.svg" alt="avatar" />
        </div>
        <div class="compose-right">
          <textarea class="compose-textarea" id="modal-compose-text" placeholder="What's happening?" maxlength="280"></textarea>
          <div class="compose-footer">
            <span class="compose-count" id="modal-compose-count">280</span>
            <button class="btn btn-primary btn-sm" id="modal-post-btn">Post</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
