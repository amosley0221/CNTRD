# Builds the CNTRD Android APK and publishes it to the `android-latest`
# GitHub Release so anyone can grab the latest .apk from the Releases
# page. Runs on every push that touches android/ or this workflow, plus
# a manual `workflow_dispatch` trigger.
name: Build Android APK

on:
  push:
    branches: ["claude/implement-cntrd-design-ikHMT"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to create / update the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install what the app targets (SDK 34, build-tools 34.0.0).
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.6

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/cntrd.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cntrd-apk
          path: dist/cntrd.apk

      - name: Publish to "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "CNTRD Android — latest"
          body: |
            Download `cntrd.apk` below and install on Android 7.0+.
            Built from commit ${{ github.sha }}.

            **Install:** on your phone, tap the APK, allow "Install from
            unknown sources" if prompted.
          files: dist/cntrd.apk
          make_latest: true
          # Overwrite the same "android-latest" tag on every build so the
          # Releases page always shows the most recent APK at a stable URL.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
